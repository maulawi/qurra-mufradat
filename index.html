<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>QURRA Mufradat al-Qur'an — Qur'anic Vocabulary Explorer</title>
<meta name="description" content="Explore the vocabulary of the Qur'an systematically — Juz by Juz, Surah by Ayah, word by word. A QURRA product prototype." />

<!-- Favicon: the sidebar's ق brand mark, inline (no extra request, no external service) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e2a20'/%3E%3Crect x='3' y='3' width='58' height='58' rx='11' fill='none' stroke='%23b4883a' stroke-width='2'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23e2c88a' font-family='Amiri,Traditional Arabic,serif'%3E%26%231602%3B%3C/text%3E%3C/svg%3E" />

<!-- Fonts: Inter (UI), Cormorant Garamond (headings), Amiri (Qur'anic Arabic) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/vocabulary.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<!-- Icon sprite: inline, local, stroke-based (inherits currentColor). Used by the mobile bottom nav, search toggle and homepage cards. -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="qm-i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7M5.5 9.7V20h5v-5.5h3V20h5V9.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="qm-i-juz" viewBox="0 0 24 24"><path d="M12 6.2C9.8 4.9 7.2 4.2 3.8 4.2v13.6c3.4 0 6 .7 8.2 2 2.2-1.3 4.8-2 8.2-2V4.2c-3.4 0-6 .7-8.2 2zM12 6.2v13.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="qm-i-surahs" viewBox="0 0 24 24"><path d="M5.5 4h11.2a1.8 1.8 0 0 1 1.8 1.8V20H7.3a1.8 1.8 0 0 1-1.8-1.8zM5.5 18.2A1.8 1.8 0 0 1 7.3 16.4h11.2M9.2 8.2h5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="qm-i-roots" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.3"/><circle cx="5.5" cy="18" r="2.3"/><circle cx="18.5" cy="18" r="2.3"/><path d="M12 7.8v4.2M12 12l-5 4.2M12 12l5 4.2"/></g></symbol>
  <symbol id="qm-i-lemmas" viewBox="0 0 24 24"><path d="M7 3.5h7.5L19 8v12.5H7zM14.5 3.5V8H19M10 12.2h6M10 15.8h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="qm-i-search" viewBox="0 0 24 24"><path d="m20.5 20.5-4.6-4.6M10.8 17.6a6.8 6.8 0 1 1 0-13.6 6.8 6.8 0 0 1 0 13.6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="qm-i-info" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5.4M12 7.6v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="qm-i-chevron" viewBox="0 0 24 24"><path d="m9 5.5 6.5 6.5L9 18.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<a class="qm-skip-link" href="#qm-main" data-i18n="common.skipToMain">Skip to main content</a>

<div id="qm-app" class="qm-app">

  <!-- ===================== Desktop / tablet side navigation ===================== -->
  <header class="qm-sidebar" id="qm-sidebar" aria-label="Primary">
    <div class="qm-sidebar__brand">
      <a href="#/home" class="qm-brand-link" data-route-link>
        <span class="qm-brand-mark" aria-hidden="true">ق</span>
        <span class="qm-brand-text">
          <span class="qm-brand-title">QURRA</span>
          <span class="qm-brand-subtitle">Mufradat al-Qur'an</span>
        </span>
      </a>
    </div>

    <nav class="qm-sidebar__nav" aria-label="Sections">
      <a href="#/home" class="qm-nav-link" data-route-link data-nav="home">
        <span class="qm-nav-icon" aria-hidden="true">⌂</span> <span data-i18n="nav.home">Home</span>
      </a>
      <a href="#/juz" class="qm-nav-link" data-route-link data-nav="juz">
        <span class="qm-nav-icon" aria-hidden="true">◫</span> <span data-i18n="nav.juz">Juz</span>
      </a>
      <a href="#/surahs" class="qm-nav-link" data-route-link data-nav="surahs">
        <span class="qm-nav-icon" aria-hidden="true">﴾﴿</span> <span data-i18n="nav.surahs">Surahs</span>
      </a>
      <a href="#/roots" class="qm-nav-link" data-route-link data-nav="roots">
        <span class="qm-nav-icon" aria-hidden="true">⟨⟩</span> <span data-i18n="nav.roots">Roots</span>
      </a>
      <a href="#/lemmas" class="qm-nav-link" data-route-link data-nav="lemmas">
        <span class="qm-nav-icon" aria-hidden="true">⌘</span> <span data-i18n="nav.lemmas">Lemmas</span>
      </a>
    </nav>

    <div class="qm-sidebar__search">
      <label for="qm-search-input" class="qm-visually-hidden" data-i18n="common.searchVocabularyLabel">Search vocabulary</label>
      <input type="search" id="qm-search-input" class="qm-search-input" data-i18n-placeholder="common.searchPlaceholder" placeholder="Search word, lemma, or root…" autocomplete="off" />
      <div id="qm-search-results" class="qm-search-results" hidden></div>
    </div>

    <div class="qm-sidebar__footer">
      <div class="qm-lang-switch" role="group" data-i18n-aria-label="common.languageLabel" aria-label="Language">
        <button type="button" class="qm-lang-switch__btn" data-lang-switch="en" data-i18n-aria-label="common.languageEn" aria-label="English">EN</button>
        <span class="qm-lang-switch__sep" aria-hidden="true">|</span>
        <button type="button" class="qm-lang-switch__btn" data-lang-switch="ms" data-i18n-aria-label="common.languageMs" aria-label="Bahasa Melayu">BM</button>
      </div>
      <span class="qm-badge qm-badge--demo" data-i18n="badge.demo">Beta version</span>
    </div>
  </header>

  <!-- ===================== Mobile top bar ===================== -->
  <header class="qm-topbar" aria-label="Primary">
    <a href="#/home" class="qm-topbar__brand" data-route-link>
      <span class="qm-brand-mark" aria-hidden="true">ق</span>
      <span class="qm-topbar__title">QURRA Mufradat</span>
    </a>
    <div class="qm-lang-switch qm-lang-switch--mobile" role="group" data-i18n-aria-label="common.languageLabel" aria-label="Language">
      <button type="button" class="qm-lang-switch__btn" data-lang-switch="en" data-i18n-aria-label="common.languageEn" aria-label="English">EN</button>
      <span class="qm-lang-switch__sep" aria-hidden="true">/</span>
      <button type="button" class="qm-lang-switch__btn" data-lang-switch="ms" data-i18n-aria-label="common.languageMs" aria-label="Bahasa Melayu">BM</button>
    </div>
    <button type="button" class="qm-topbar__search-toggle" id="qm-mobile-search-toggle" data-i18n-aria-label="common.search" aria-label="Search" aria-expanded="false" aria-controls="qm-mobile-search">
      <svg class="qm-icon" aria-hidden="true"><use href="#qm-i-search"/></svg>
    </button>
  </header>
  <div class="qm-mobile-search" id="qm-mobile-search" hidden>
    <label for="qm-mobile-search-input" class="qm-visually-hidden" data-i18n="common.searchVocabularyLabel">Search vocabulary</label>
    <input type="search" id="qm-mobile-search-input" class="qm-search-input" data-i18n-placeholder="common.searchPlaceholder" placeholder="Search word, lemma, or root…" autocomplete="off" />
    <div id="qm-mobile-search-results" class="qm-search-results" hidden></div>
  </div>

  <!-- ===================== Main content ===================== -->
  <main id="qm-main" class="qm-main" tabindex="-1">
    <div id="qm-view" class="qm-view"></div>
    <footer class="qm-attribution">
      <a href="https://tanzil.net" target="_blank" rel="noopener noreferrer" data-i18n="status.attribution">Qur'anic text: Tanzil Project (tanzil.net), Creative Commons Attribution 3.0.</a>
    </footer>
  </main>

  <!-- ===================== Mobile bottom navigation ===================== -->
  <nav class="qm-bottomnav" aria-label="Sections">
    <a href="#/home" class="qm-bottomnav__link" data-route-link data-nav="home">
      <svg class="qm-icon qm-nav-icon" aria-hidden="true"><use href="#qm-i-home"/></svg><span data-i18n="nav.home">Home</span>
    </a>
    <a href="#/juz" class="qm-bottomnav__link" data-route-link data-nav="juz">
      <svg class="qm-icon qm-nav-icon" aria-hidden="true"><use href="#qm-i-juz"/></svg><span data-i18n="nav.juz">Juz</span>
    </a>
    <a href="#/surahs" class="qm-bottomnav__link" data-route-link data-nav="surahs">
      <svg class="qm-icon qm-nav-icon" aria-hidden="true"><use href="#qm-i-surahs"/></svg><span data-i18n="nav.surahs">Surahs</span>
    </a>
    <a href="#/roots" class="qm-bottomnav__link" data-route-link data-nav="roots">
      <svg class="qm-icon qm-nav-icon" aria-hidden="true"><use href="#qm-i-roots"/></svg><span data-i18n="nav.roots">Roots</span>
    </a>
    <a href="#/lemmas" class="qm-bottomnav__link" data-route-link data-nav="lemmas">
      <svg class="qm-icon qm-nav-icon" aria-hidden="true"><use href="#qm-i-lemmas"/></svg><span data-i18n="nav.lemmas">Lemmas</span>
    </a>
  </nav>

  <!-- ===================== Word detail overlay (drawer on mobile, panel on desktop) ===================== -->
  <div id="qm-detail-overlay" class="qm-detail-overlay" hidden>
    <div class="qm-detail-overlay__scrim" data-detail-close></div>
    <section class="qm-detail-panel" id="qm-detail-panel" role="dialog" aria-modal="true" aria-labelledby="qm-detail-title">
      <button type="button" class="qm-detail-panel__close" data-detail-close data-i18n-aria-label="detailOverlay.closeAriaLabel" aria-label="Close word details">✕</button>
      <div id="qm-detail-content" class="qm-detail-content"></div>
    </section>
  </div>

</div>

<script src="js/translations/en.js"></script>
<script src="js/translations/ms.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/normalize.js"></script>
<script src="js/generated/dataset.js"></script>
<script src="js/generated/search-index.js"></script>
<script src="js/generated/translations.js"></script>
<script src="js/data.js"></script>
<script src="js/filters.js"></script>
<script src="js/wordDetail.js"></script>
<script src="js/render.js"></script>
<script src="js/navigation.js"></script>
<script src="js/router.js"></script>
<script src="js/main.js"></script>
</body>
</html>
